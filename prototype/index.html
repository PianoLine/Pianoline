<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人作品集 · 作品卡</title>
  <script>
    const display = new URLSearchParams(location.search);
    if (display.has("embed")) document.documentElement.classList.add("embedded");
  </script>
  <link rel="stylesheet" href="prototype.css?v=intro-layer">
</head>
<body>
  <header class="standalone"><a href="../index.html">PAN HOULIN</a><nav aria-label="页面导航"><a href="../index.html#about">简介</a><a href="../index.html#projects">项目</a><a href="../index.html#updates">动态</a><a href="../index.html#contact">联系</a></nav></header>
  <main class="arena" id="arena">
    <section class="stage" aria-labelledby="title">
      <div class="opening">
        <p class="edition"><i aria-hidden="true"></i> 个人作品集</p>
        <h1 id="title">作品集</h1>
        <p class="byline" id="byline"></p>
        <a class="browse" target="_top" href="../index.html#projects">直接浏览全部作品 <span aria-hidden="true">↗</span></a>
      </div>
    </section>
    <div class="encounter">
        <p class="speech" id="speech" role="status">想先看看哪个作品？</p>
        <button class="ghost" id="ghost" type="button" aria-label="点击了解我，或把卡牌拖到这里">
          <img src="art/front-ghost.webp" alt="" draggable="false">
          <span class="hit" aria-hidden="true">−128</span>
          <span class="ghost-label">个人简介 ↗</span>
        </button>
    </div>
    <div class="scene-edges" aria-hidden="true"></div>
    <section class="table" aria-labelledby="hand-title">
      <div class="table-inner">
        <div class="table-head"><h2 id="hand-title">作品卡 <small id="count"></small></h2><p>点选作品卡，或将卡片拖给小幽灵</p></div>
        <div class="play-row">
          <div class="deckzone">
            <button id="deck" class="deck" aria-label="抽取一张项目卡"><span class="deck-art" aria-hidden="true"><i>✷</i></span><span class="deck-copy"><b>抽一张 <span aria-hidden="true">＋</span></b><small>牌库余 <span id="remaining"></span> 张</small></span></button>
            <span class="deck-hint">拖到牌库可放回</span>
          </div>
          <div class="hand" id="hand"></div>
          <button class="end" id="end"><span>回合结束 <i aria-hidden="true">↗</i></span><small>前往动态</small></button>
        </div>
      </div>
    </section>
    <div id="transition" class="transition" aria-hidden="true"><span>翻开作品</span><strong id="transition-title"></strong></div>
  </main>
  <dialog id="about" aria-labelledby="about-name"><button id="close" aria-label="关闭简介">×</button><span class="edition">ABOUT THE DESIGNER</span><h2 id="about-name"></h2><p id="about-copy"></p><a class="browse" href="../index.html#about" target="_top">查看完整介绍 ↗</a></dialog>
  <script src="../assets/site-content.js?v=woodcut"></script>
  <script src="cabin-mesh.js?v=paperfire"></script>
  <script src="cabin-view.js?v=paperfire"></script>
  <script src="prototype.js?v=paperfire"></script>
</body>
</html>
