(()=>{const $=s=>document.querySelector(s),stage=$('#stage'),ghost=$('#ghost'),bubble=$('#bubble'),status=$('#status');let drag=null;function hit(){ghost.classList.remove('hit');status.classList.remove('on');void ghost.offsetWidth;ghost.classList.add('hit');status.classList.add('on');bubble.textContent='“呜哇！你还真打啊！”';setTimeout(()=>bubble.textContent='“刚才只是我没站稳！”',1100)}ghost.onclick=hit;$('#faces').onclick=e=>{stage.classList.toggle('show-faces');e.currentTarget.textContent=stage.classList.contains('show-faces')?'隐藏拆面轮廓':'显示拆面轮廓'};$('#deck').onclick=()=>bubble.textContent='“牌库位置先在这里，抽牌功能将在正式版接入。”';$('#end').onclick=()=>bubble.textContent='“回合结束后会进入动态栏。”';stage.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=stage.getBoundingClientRect();stage.style.setProperty('--x',((e.clientX-r.left)/r.width-.5).toFixed(3));stage.style.setProperty('--y',((e.clientY-r.top)/r.height-.5).toFixed(3))});stage.addEventListener('pointerleave',()=>{stage.style.setProperty('--x',0);stage.style.setProperty('--y',0)});document.querySelectorAll('.card').forEach(c=>{c.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,moved:false,clone:null};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){drag.moved=true;drag.clone=c.cloneNode(true);drag.clone.classList.add('dragging');document.body.appendChild(drag.clone);c.style.opacity='.3';bubble.textContent='“等等……有话好说！”'}if(drag.moved){drag.clone.style.left=e.clientX+'px';drag.clone.style.top=e.clientY+'px'}});function finish(e,cancel){if(!drag)return;let d=drag;drag=null;d.clone?.remove();c.style.opacity='';const r=ghost.getBoundingClientRect();if(!cancel&&(!d.moved||(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)))hit();else if(!cancel)bubble.textContent='“没打中，再试试看！”'}c.addEventListener('pointerup',e
