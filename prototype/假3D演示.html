<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>假 3D 动画演示</title><style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#edf0e9;background:#0d1012}*{box-sizing:border-box}body{margin:0}header{max-width:1150px;margin:auto;padding:28px 24px 12px}.eyebrow{color:#a6d8cc;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(26px,4vw,42px);margin:8px 0}p{color:#a8b8b0;line-height:1.6}button,a{font:inherit}button{cursor:pointer}.wrap{max-width:1150px;margin:auto;padding:0 24px 60px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.controls button,.controls a{border:1px solid #566962;background:#1c2826;color:#e7eee8;padding:10px 16px;border-radius:8px;text-decoration:none}.controls button.active{background:#d3a062;color:#151b19;border-color:#d3a062}.stage{position:relative;height:590px;border-radius:20px;overflow:hidden;background:#182420;border:1px solid #56635c;perspective:900px;touch-action:pan-y}.room{position:absolute;inset:-3%;background:radial-gradient(ellipse at 50% 30%,#566d5e 0,#253831 40%,#101917 80%);transition:transform .15s}.lamp{position:absolute;top:0;left:17%;height:170px;width:2px;background:#8b7659}.lamp:after{content:'';position:absolute;top:130px;left:-35px;width:72px;height:36px;background:#d3a062;border-radius:70px 70px 10px 10px;box-shadow:0 20px 50px #e4ad6555}.floor{position:absolute;width:130%;height:55%;bottom:-21%;left:-15%;background:linear-gradient(#44584c,#273b33);border:5px solid #aa9673;border-radius:36px;transform:rotateX(54deg);box-shadow:0 0 50px #0007}.floor:after{content:'';position:absolute;inset:12%;border:2px solid #c8b99877;border-radius:15px}.ghost{position:absolute;top:23%;left:50%;width:140px;height:140px;transform:translate(-50%,-50%);filter:drop-shadow(0 16px 7px #0007);transition:filter .2s}.ghost svg{width:100%;height:100%;animation:float 3s ease-in-out infinite}.ghost.hurt svg{animation:hurt .65s ease}.bubble{position:absolute;top:9%;left:61%;background:#ecddbf;color:#222a24;padding:12px 16px;border-radius:10px;box-shadow:4px 4px #1117;font-size:14px;max-width:260px}.bubble:after{content:'';position:absolute;bottom:-12px;left:22px;border:8px solid transparent;border-top-color:#ecddbf}.damage{position:absolute;left:54%;top:16%;font-size:38px;font-weight:900;color:#f3cd96;opacity:0}.damage.show{animation:damage .8s ease}.drop{position:absolute;top:12%;left:39%;width:22%;height:28%;border:2px dashed transparent;border-radius:50%;pointer-events:none}.drop.over{border-color:#d3a062;background:#d3a06222}.cards{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);display:flex;align-items:end;gap:12px}.card{width:130px;height:184px;background:#eadfc8;color:#293029;border:3px solid #96866b;border-radius:9px;box-shadow:0 7px #716853,0 12px 18px #0008;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;touch-action:none;user-select:none;cursor:grab;transform:rotate(var(--r));transition:transform .2s;position:relative}.card:hover,.card:focus-visible{transform:translateY(-18px) rotate(0deg) scale(1.04)}.card:focus-visible{outline:3px solid #a6d8cc}.card .symbol{font-size:55px;line-height:1}.card small{font-size:11px;color:#666657}.card.dragging{z-index:5;position:fixed;margin:0;transition:none;pointer-events:none;cursor:grabbing;transform:translate(-50%,-50%) rotate(4deg) scale(1.08)}.tap{position:absolute;bottom:12px;right:16px;font-size:12px;color:#c5cbbc}.banner{position:absolute;inset:0;background:#d3a062;color:#17211d;display:grid;place-items:center;clip-path:circle(0 at 50% 35%);transition:clip-path .45s;pointer-events:none}.banner.show{clip-path:circle(100% at 50% 35%)}.banner strong{font-size:clamp(28px,5vw,60px)}.details{display:flex;gap:25px;flex-wrap:wrap;margin-top:18px;color:#a6afaa;font-size:14px}.details b{color:#e8d3ad}@keyframes float{50%{transform:translateY(-9px) rotate(3deg)}}@keyframes hurt{25%{transform:translateX(-22px) scale(.84,1.15) rotate(-12deg)}55%{transform:translateX(12px) scale(1.15,.8) rotate(8deg)}}@keyframes damage{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-65px)}}@media(max-width:600px){.wrap{padding:0 12px 40px}.stage{height:530px}.card{width:88px;height:135px}.card .symbol{font-size:40px}.card b{font-size:12px}.bubble{left:55%;top:5%;font-size:12px}.ghost{width:110px;height:110px}.tap{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body><header><div class="eyebrow">PAPER MOTION STUDY · 临时动画演示</div><h1>用纸片做出空间感</h1><p>这是三种效果的对比，不是最终美术。移动鼠标看看视差；拖动卡牌到幽灵，或直接点击卡牌体验受击。</p></header><div class="wrap"><div class="controls"><button data-mode="camera" class="active">01 · 轻微镜头跟随</button><button data-mode="draw">02 · 抽牌与手牌</button><button data-mode="hit">03 · 受击与转场</button><button id="replay">重新播放</button><a href="../index.html#projects">查看现有作品 ↗</a></div><section class="stage" id="stage" aria-label="假三维动画演示"><div class="room" id="room"><div class="lamp"></div><div class="floor"></div></div><div class="bubble" id="bubble">移动鼠标，场景会轻微跟随。</div><div class="ghost" id="ghost"><svg viewBox="0 0 140 140" aria-hidden="true"><path d="M17 78 L33 62 L34 37 L67 8 L108 25 L113 61 L129 78 L110 84 L112 116 L94 105 L77 124 L62 109 L45 120 L33 99 L13 96 Z" fill="#ebe9db" stroke="#c6c9b8" stroke-width="2"/><path d="M42 49 l24 7 -3 9 -23 -6z M79 56 l24 -8 3 10 -24 8z" fill="#26302b"/><path d="M66 80 Q79 95 92 78 Q80 108 66 80" fill="#26302b"/></svg></div><div class="drop" id="drop"></div><div class="damage" id="damage">−128</div><div class="cards" id="cards"><button class="card" style="--r:-6deg" data-name="幽都绘卷"><span class="symbol">⚔</span><b>幽都绘卷</b><small>战斗与探索</small></button><button class="card" style="--r:0deg" data-name="锻刀模拟器"><span class="symbol">⚒</span><b>锻刀模拟器</b><small>VR 交互</small></button><button class="card" style="--r:6deg" data-name="贪婪幽灵"><span class="symbol">♠</span><b>贪婪幽灵</b><small>解谜探索</small></button></div><div class="tap">可点击卡牌体验 · 不会跳离此演示</div><div class="banner" id="banner"><strong id="name">项目发现</strong></div></section><div class="details"><span><b>画面：</b>二维图层 + 透视</span><span><b>操作：</b>鼠标 / 触摸 / 点击</span><span><b>范围：</b>临时效果，不修改正式首页</span></div></div><script>
(()=>{const $=s=>document.querySelector(s),stage=$('#stage'),room=$('#room'),ghost=$('#ghost'),drop=$('#drop'),bubble=$('#bubble'),damage=$('#damage'),banner=$('#banner'),cards=[...document.querySelectorAll('.card')];let mode='camera',drag=null,start=null,moved=false,timer;function reset(){clearTimeout(timer);banner.classList.remove('show');ghost.classList.remove('hurt');damage.classList.remove('show');cards.forEach(c=>{c.style.transform='';c.style.opacity=''});bubble.textContent=mode==='camera'?'移动鼠标，场景会轻微跟随。':mode==='draw'?'纸牌从牌堆飞入手中，试着拿起一张。':'把牌拖向我？我才不怕呢！'}function hit(name){reset();bubble.textContent='呜哇！你还真打啊！';void ghost.offsetWidth;ghost.classList.add('hurt');damage.classList.add('show');timer=setTimeout(()=>{$('#name').textContent='项目发现 · '+name;banner.classList.add('show');timer=setTimeout(()=>{banner.classList.remove('show');bubble.textContent='这里会进入对应的项目页面。'},1100)},850)}function draw(){reset();cards.forEach((c,i)=>{c.animate([{transform:'translate(270px,-30px) rotate(20deg) scale(.7)',opacity:0},{transform:`translateY(0) rotate(${[-6,0,6][i]}deg)`,opacity:1}],{duration:550,delay:i*150,easing:'cubic-bezier(.2,.8,.2,1)'})})}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));reset();if(mode==='draw')draw();if(mode==='hit')hit('幽都绘卷')});$('#replay').onclick=()=>{if(mode==='draw')draw();else if(mode==='hit')hit('幽都绘卷');else reset()};stage.addEventListener('pointermove',e=>{if(drag)return;if(e.pointerType!=='mouse'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=stage.getBoundingClientRect();room.style.transform=`translate(${(e.clientX/r.width-r.left/r.width-.5)*-12}px,${((e.clientY-r.top)/r.height-.5)*-8}px) scale(1.03)`});stage.addEventListener('pointerleave',()=>room.style.transform='');cards.forEach(c=>{c.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag=c;start={x:e.clientX,y:e.clientY};moved=false;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag!==c)return;if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>6)moved=true;if(!moved)return;c.classList.add('dragging');c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';const r=drop.getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;drop.classList.toggle('over',inside);bubble.textContent=inside?'等等！有话好说！':'拖到小幽灵身上试试！'});c.addEventListener('pointerup',e=>{if(drag!==c)return;const r=drop.getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;c.classList.remove('dragging');c.style.left='';c.style.top='';drop.classList.remove('over');drag=null;if(inside||!moved)hit(c.dataset.name);else bubble.textContent='没打中！再试一次。'});c.addEventListener('pointercancel',()=>{drag=null;c.classList.remove('dragging');c.style.left='';c.style.top='';drop.classList.remove('over')});c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(c.dataset.name)}})})})();
</script></body></html>
