<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="个人作品集内容与排版编辑器。">
    <title>作品集编辑器</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body class="editor-page">
    <header class="editor-topbar">
      <div class="editor-topbar-inner">
        <a class="brand" href="index.html"><span class="brand-mark">PH</span><span>作品集编辑器</span></a>
        <a class="button editor-home-link" href="index.html">查看已发布网站 ↗</a>
      </div>
    </header>
    <main class="editor-main">
      <section class="editor-intro">
        <span class="micro-label">内容与排版编辑器</span>
        <h1>自己维护网站，<em>不必每次改代码。</em></h1>
        <p>这里可以填写个人介绍和联系方式，也可以编辑项目文字、颜色和图片路径。改动先保存到<strong>当前浏览器</strong>；预览后可下载完整网站压缩包，或者只下载内容文件更新已有网站。</p>
        <div class="editor-warning"><strong>发布说明：</strong>编辑器保存的是本机草稿。下载完整网站后，你可以解压在电脑上查看，或上传到自己的 GitHub Pages；现有公开链接不会自动更新。</div>
      </section>

      <section class="editor-actions" aria-label="编辑操作">
        <button class="button primary" type="button" data-action="save">保存草稿到本浏览器</button>
        <button class="button" type="button" data-action="preview">预览草稿</button>
        <button class="button" type="button" data-action="download">下载 site-content.js</button>
        <button class="button" type="button" data-action="website">下载完整网站</button>
        <button class="button subtle" type="button" data-action="reset">恢复已发布版本</button>
        <span class="editor-status" role="status" aria-live="polite">尚未修改</span>
      </section>

      <div id="editor-root" class="editor-root"></div>
    </main>
    <script src="assets/site-content.js"></script>
    <script src="assets/schema.js"></script>
    <script src="assets/export-site.js"></script>
    <script src="assets/editor.js"></script>
