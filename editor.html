<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="个人作品集内容与排版编辑器。">
    <title>作品集编辑器</title>
    <link rel="stylesheet" href="assets/fonts/titles.css?v=pixel-table-3">
    <link rel="stylesheet" href="assets/styles.css?v=opening-note">
  </head>
  <body class="editor-page">
    <header class="editor-topbar">
      <div class="editor-topbar-inner">
        <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span>作品集编辑器</span></a>
        <a class="button editor-home-link" href="index.html">查看网站首页 ↗</a>
      </div>
    </header>
    <main class="editor-main">
      <section class="editor-intro">
        <h1>作品集内容编辑器</h1>
        <p>修改会自动保存到当前浏览器。用「预览草稿」检查首页、手牌和项目详情，再下载内容文件或整站备份。</p>
        <nav class="editor-jump" aria-label="编辑栏目">
          <a href="#profile">首页与简介</a><a href="#projects">项目作品</a><a href="#playlist">背景音乐</a><a href="#posts">开发日志</a><a href="#contact">联系方式</a><a href="#appearance">颜色与排版</a>
        </nav>
      </section>

      <section class="editor-actions" aria-label="编辑操作">
        <button class="button primary" type="button" data-action="save">保存草稿</button>
        <button class="button" type="button" data-action="preview">预览草稿</button>
        <button class="button" type="button" data-action="download">下载 site-content.js</button>
        <button class="button" type="button" data-action="website">导出整站 ZIP</button>
        <button class="button subtle" type="button" data-action="reset">还原到网站文件版本</button>
        <span class="editor-status" role="status" aria-live="polite">草稿准备就绪</span>
      </section>

      <div id="editor-root" class="editor-root"></div>
    </main>
    <script src="assets/site-content.js?v=pixel-table-3"></script>
    <script src="assets/schema.js?v=playlist"></script>
    <script src="assets/playlist-files.js"></script>
    <script src="assets/export-site.js?v=playlist"></script>
    <script src="assets/editor.js?v=unique-records"></script>
  </body>
</html>
