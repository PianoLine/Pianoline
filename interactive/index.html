<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <style>html { background: #10100f; }</style>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人作品集 · 作品卡</title>
  <script>
    const display = new URLSearchParams(location.search);
    const tableKey = "portfolio-table-v1:" + new URL("../", location.href).pathname + (display.has("preview") ? ":preview" : "");
    const resumeTable = display.has("resume") || performance.getEntriesByType("navigation")[0]?.type === "back_forward";
    if (display.has("embed")) document.documentElement.classList.add("embedded");
    // The embedded table has its own height. Use the host viewport for phone rotation.
    const viewport = window.frameElement?.ownerDocument.defaultView || window;
    const phoneLandscape = viewport.matchMedia("(pointer:coarse) and (orientation:landscape) and (max-height:550px) and (max-width:1000px)");
    function updatePhoneLayout() { document.documentElement.classList.toggle("phone-landscape", phoneLandscape.matches); }
    updatePhoneLayout();
    phoneLandscape.addEventListener("change", updatePhoneLayout);
  </script>
  <link rel="stylesheet" href="../assets/fonts/titles.css?v=pixel-table-3">
  <link rel="stylesheet" href="prototype.css?v=lit-room">
  <link rel="stylesheet" href="../assets/site-music.css?v=music-prompt">
</head>
<body>
  <header class="standalone"><a href="../index.html"><span class="brand-mark" aria-hidden="true"></span>PIANOLILNE</a><div class="site-music"></div><nav aria-label="页面导航"><a href="../index.html#about">简介</a><a href="../index.html#projects">项目</a><a href="../index.html#updates">动态</a><a href="../index.html#contact">联系</a></nav></header>
  <main class="arena" id="arena">
    <div class="audio-controls" role="group" aria-label="声音设置">
    <button id="sound-toggle" class="sound-toggle" type="button" tabindex="-1" aria-label="牌桌音效" aria-pressed="false" hidden>
      <i class="speaker" aria-hidden="true"></i><span class="sound-state">点击开启音效</span>
    </button>
    </div>
    <section class="stage" aria-labelledby="title">
      <div class="opening">
        <p class="edition"><i aria-hidden="true"></i> 个人作品集</p>
        <div class="opening-copy">
          <h1 id="title">作品集</h1>
          <p class="byline" id="byline"></p>
          <p class="opening-note" id="opening-note" hidden></p>
        </div>
        <a class="browse" target="_top" href="../index.html#projects">浏览项目 <span aria-hidden="true">↗</span></a>
      </div>
    </section>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <defs><clipPath id="dream-table-contact" clipPathUnits="objectBoundingBox">
        <polygon transform="scale(.0078125)" id="dream-table-edge" points="0,0 128,0 128,120 0,120"/>
        <!-- The exposed arms stay in front of the table in all five finger poses. -->
        <path transform="scale(.0078125)" d="M30 107H46V110H47V111H49V112H51V113H52V114H54V116H62V115H70V114H74V113H80V112H84V110H85V109H86V108H95V110H96V112H97V116H98V120H97V122H96V123H95V124H67V125H52V124H45V125H43V126H42V125H40V126H39V125H37V126H35V124H32V123H31V122H30V121H29V119H28V115H27V112H28V109H29V108H30Z"/>
      </clipPath></defs>
    </svg>
    <div class="encounter">
        <button tabindex="-1" class="ghost" id="ghost" type="button" title="守望人" aria-label="和守望人聊天，或把作品卡拖给她">
          <span class="speech" id="speech" aria-hidden="true" hidden></span>
          <span class="ghost-portrait" aria-hidden="true">
            <span class="skin-layers">
              <span class="portrait-layer portrait-ink"><img src="art/celadon-ghost.png?v=eyelids" width="128" height="128" alt="" draggable="false"></span>
              <span class="portrait-layer portrait-embers"><img src="art/celadon-ghost-expression.png?v=eyelids" width="128" height="128" alt="" draggable="false"></span>
            </span>
          </span>
          <span class="hit" aria-hidden="true"></span>
        </button>
    </div>
    <button type="button" id="window-moon" aria-label="点击月亮，进入城堡" hidden></button>
    <button type="button" id="skin-mirror" aria-label="古镜，切换角色皮肤" hidden></button>
    <span class="ghost-voice" id="ghost-voice" role="status" aria-atomic="true"></span>
    <div class="scene-edges" aria-hidden="true"></div>
    <div class="board-slots" id="board-slots" role="group" aria-label="己方三个牌位">
      <div class="board-slot"></div><div class="board-slot"></div><div class="board-slot"></div>
    </div>
    <section class="table" aria-label="作品手牌">
      <div class="table-inner">
        <div class="play-row">
          <div class="deckzone">
            <button tabindex="-1" id="deck" class="deck" aria-label="抽一张作品卡" aria-describedby="deck-tip">
              <span class="control-art deck-art" aria-hidden="true"><i>✷</i></span>
              <span class="prop-tip" id="deck-tip" role="tooltip"><b>抽一张</b><small>牌库余 <span id="remaining"></span> 张</small><small>拖到这里可放回</small></span>
            </button>
          </div>
          <button tabindex="-1" type="button" id="shuffle" class="shuffle" aria-label="怀表：洗回手牌和已用牌，重新抽三张" aria-describedby="shuffle-tip">
            <span class="control-art shuffle-art" aria-hidden="true"></span>
            <span class="prop-tip" id="shuffle-tip" role="tooltip"><b>洗牌重抽</b><small>洗回手牌和已用牌，重发三张</small></span>
          </button>
          <div class="hand" id="hand"></div>
          <button tabindex="-1" class="end" id="end" aria-label="结束回合，前往动态" aria-describedby="bell-tip">
            <span class="control-art bell-art" aria-hidden="true"></span>
            <span class="prop-tip" id="bell-tip" role="tooltip"><b>回合结束</b><small>按铃前往动态</small></span>
          </button>
        </div>
      </div>
    </section>
    <div id="transition" class="transition" aria-hidden="true"><div class="reveal-cover"><img id="transition-image" alt="" hidden><strong id="transition-title"></strong></div></div>
  </main>
  <script src="../assets/schema.js?v=dream-red-book"></script>
  <script src="../assets/playlist-files.js"></script>
  <script src="../assets/site-content.js?v=stream-playback"></script>
  <script src="art/book-prints.js?v=sky-to-rim"></script>
  <script src="cabin-mesh.js?v=castle-bookshelf"></script>
  <script src="portrait-light.js?v=lit-room"></script>
  <script src="cabin-view.js?v=lit-room"></script>
  <script src="ghost-idle.js?v=lit-room"></script>
  <script src="golden-veil.js?v=mist-wisps"></script>
  <script src="skin-mirror.js?v=lit-room"></script>
  <script src="table-audio.js?v=duel-placement"></script>
  <script src="../assets/music-spectrum.js?v=stream-playback"></script>
  <script src="../assets/site-music.js?v=mobile-playhead"></script>
  <script src="prototype.js?v=lit-room"></script>
</body>
</html>
