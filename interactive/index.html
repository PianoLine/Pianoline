<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人作品集 · 作品卡</title>
  <script>
    const display = new URLSearchParams(location.search);
    if (display.has("embed")) document.documentElement.classList.add("embedded");
  </script>
  <link rel="stylesheet" href="../assets/fonts/titles.css?v=pixel-table-3">
  <link rel="stylesheet" href="prototype.css?v=pixel-table">
</head>
<body>
  <header class="standalone"><a href="../index.html"><span class="brand-mark" aria-hidden="true"></span>PIANOLINE</a><nav aria-label="页面导航"><a href="../index.html#about">简介</a><a href="../index.html#projects">项目</a><a href="../index.html#updates">动态</a><a href="../index.html#contact">联系</a></nav></header>
  <main class="arena" id="arena">
    <section class="stage" aria-labelledby="title">
      <div class="opening">
        <p class="edition"><i aria-hidden="true"></i> 个人作品集</p>
        <h1 id="title">作品集</h1>
        <p class="byline" id="byline"></p>
        <a class="browse" target="_top" href="../index.html#projects">直接浏览全部作品 <span aria-hidden="true">↗</span></a>
      </div>
    </section>
    <div class="encounter">
        <button class="ghost" id="ghost" type="button" aria-label="和小幽灵聊天，或把作品卡拖给它">
          <span class="speech" id="speech" role="status" aria-live="polite">想先看看哪个作品？</span>
          <img src="art/front-ghost.webp" alt="" draggable="false">
          <span class="hit" aria-hidden="true">−128</span>
        </button>
    </div>
    <div class="scene-edges" aria-hidden="true"></div>
    <section class="table" aria-label="作品手牌">
      <div class="table-inner">
        <div class="play-row">
          <div class="deckzone">
            <button id="deck" class="deck" aria-label="抽一张作品卡" aria-describedby="deck-tip">
              <span class="control-art deck-art" aria-hidden="true"><i>✷</i></span>
              <span class="prop-tip" id="deck-tip" role="tooltip"><b>抽一张</b><small>牌库余 <span id="remaining"></span> 张</small><small>拖到这里可放回</small></span>
            </button>
          </div>
          <div class="hand" id="hand"></div>
          <button class="end" id="end" aria-label="结束回合，前往动态" aria-describedby="bell-tip">
            <span class="control-art bell-art" aria-hidden="true"></span>
            <span class="prop-tip" id="bell-tip" role="tooltip"><b>回合结束</b><small>按铃前往动态</small></span>
          </button>
        </div>
      </div>
    </section>
    <div id="transition" class="transition" aria-hidden="true"><span>翻开作品</span><strong id="transition-title"></strong></div>
  </main>
  <script src="../assets/schema.js?v=pixel-table-3"></script>
  <script src="../assets/site-content.js?v=pixel-table-3"></script>
  <script src="cabin-mesh.js?v=table-cues-2"></script>
  <script src="cabin-view.js?v=table-cues-2"></script>
  <script src="prototype.js?v=pixel-table"></script>
</body>
</html>
